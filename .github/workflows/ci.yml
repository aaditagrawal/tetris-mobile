name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install SDK packages
        run: android sdk install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"

      - name: Build and unit tests
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --no-daemon --warning-mode fail

      - name: Android lint
        run: ./gradlew lintDebug --no-daemon --warning-mode fail

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
